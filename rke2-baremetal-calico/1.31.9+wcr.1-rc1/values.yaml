# -- Cluster configuration settings
cluster:
  # -- Name of the Kubernetes cluster
  name: "prod-cluster"
  
  # -- ETCD configuration settings
  etcd:
    # -- Defines the policy for ETCD metrics exposure
    exposeMetrics: false
    # -- ETCD backup configuration
    backup:
      # -- Disable automatic ETCD snapshots
      disableAutomaticSnapshots: true
    # -- Extra arguments for ETCD configuration (https://etcd.io/docs/v3.2/op-guide/configuration/)
    extraArgs: []
    # Example extraArgs:
    # - election-timeout=1000
  
  # -- Kubernetes components configuration
  kubeComponents:
    # -- Kube Controller Manager configuration
    kubeControllerManager:
      # -- Extra arguments for the kube controller manager (https://kubernetes.io/docs/reference/command-line-tools-reference/kube-controller-manager/)
      extraArgs: []
      # Example extraArgs:
      # - cloud-provider=external
    
    # -- Kube API Server configuration
    kubeApiServer:
      # -- Extra arguments for the kube apiserver (https://kubernetes.io/docs/reference/command-line-tools-reference/kube-apiserver/)
      extraArgs: []
    
    # -- Kube Scheduler configuration
    kubeShceduler:
      # -- Extra arguments for the kube scheduler (https://kubernetes.io/docs/reference/command-line-tools-reference/kube-scheduler/)
      extraArgs: []
    
    # -- Kube Proxy configuration
    kubeProxy:
      # -- Extra arguments for the kube proxy (https://kubernetes.io/docs/reference/command-line-tools-reference/kube-proxy/)
      extraArgs: []
    
    # -- Kubelet configuration
    kubelet:
      # -- Extra arguments for the kubelet of all cluster nodes (https://kubernetes.io/docs/reference/command-line-tools-reference/kubelet/)
      extraArgs: []
  
  # -- Labels for all cluster nodes
  labels: {}
  # -- Annotations for all cluster nodes
  annotations: {}

# -- Baremetal infrastructure configuration
infraConfig:
  # -- Default users configuration for all nodes
  users:
    - name: whitestack
      password: whitestack
      authorized_keys:
        - "ssh-rsa  hector@hector"
        - "ssh-rsa  luis@tt"
  
  # -- Base image configuration for nodes
  image:
    # -- URL of the base OS image for nodes
    url: http://10.100.100.2/ubuntu-22.iso
    # -- Name of the OS image (ubuntu22 or ubuntu20)
    name: ubuntu22
  
  # -- Kernel configuration for nodes
  kernel:
    # -- Kernel version for the nodes
    version: 6.5-generic

# ===============
# Control Plane Nodes
# ===============
# -- controlPlane nodes configuration
controlPlaneNodes:
  defaults: # configuración por defecto para los nodos control-plane
    taints:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
    # -- Kubernetes labels
    labels:
      node-role.kubernetes.io/control-plane: ""
    storage:
      - vg_name: vg-root
        disks:
          - sda
          - sdb
        raid_type: 1
        boot: uefi
        lvs:
          - name: lv-root
            # -- Storage size
            size: 80GB
            fs_type: ext4
            mount: /
          - name: lv-logs
            # -- Storage size
            size: 20GB
            fs_type: ext4
            mount: /var/log
          - name: lv-tmp
            # -- Storage size
            size: 2GB
            fs_type: ext4
            mount: /var/tmp
          - name: lv-audit
            # -- Storage size
            size: 5GB
            fs_type: ext4
            mount: /var/log/audit
    bmc:
      provider: ilo
      credentialsSecret:
        # -- Name of the component
        name: "baremetal-cluster"
        # -- Kubernetes namespace
        namespace: "default"
  nodes: # lista de nodos control-plane
    - hostname: node-01
      bmc:
        provider: ilo
        address: 10.40.12.10
        credentialsSecret:
          # -- Name of the component
          name: "baremetal-cluster-1"
          # -- Kubernetes namespace
          namespace: "default"
      network:
        primaryInterface:
          address: 10.100.17.118
        netplan:
          network:
            ethernets:
              eno1:
                addresses:
                  - 10.100.2.150/24
                routes:
                  - to: default
                    via: 10.100.2.1

# ===============
# Worker Nodes
# ===============
# -- worker nodes configuration
workerNodes:
  defaults:
    taints:
      - key: node-role.kubernetes.io/worker
        effect: NoSchedule
    # -- Kubernetes labels
    labels:
      node-role.kubernetes.io/worker: ""
    storage:
      - vg_name: vg-root
        disks:
          - sda
          - sdb
        raid_type: 1
        boot: uefi
        lvs:
          - name: lv-root
            # -- Storage size
            size: 80GB
            fs_type: ext4
            mount: /
          - name: lv-logs
            # -- Storage size
            size: 20GB
            fs_type: ext4
            mount: /var/log
          - name: lv-tmp
            # -- Storage size
            size: 2GB
            fs_type: ext4
            mount: /var/tmp
          - name: lv-audit
            # -- Storage size
            size: 5GB
            fs_type: ext4
            mount: /var/log/audit
    bmc:
      provider: ilo
      credentialsSecret:
        # -- Name of the component
        name: "baremetal-worker-cluster"
        # -- Kubernetes namespace
        namespace: "default"
  nodes:
    - hostname: worker-node-01
      reservedSystemCPU: []
      bmc:
        address: 10.100.19.132
      network:
        primaryInterface:
          address: 10.100.20.198
        netplan:
          network:
            ethernets:
              eno2:
                addresses:
                  - 10.100.2.151/24
                routes:
                  - to: default
                    via: 10.100.2.1

