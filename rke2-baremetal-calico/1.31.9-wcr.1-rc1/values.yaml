# -- RKE2 cluster core configuration
cluster:
  # -- Cluster identifier used for naming resources and certificate generation
  name: "prod-cluster"
  
  # -- ETCD distributed key-value store configuration
  etcd:
    # -- Enable Prometheus metrics endpoint for ETCD monitoring (port 2381)
    exposeMetrics: false
    # -- ETCD backup and snapshot configuration
    backup:
      # -- Disable automatic periodic snapshots (manual snapshots still available)
      disableAutomaticSnapshots: true
    # -- Additional command-line arguments for ETCD server startup
    extraArgs: []
    # Example extraArgs for ETCD tuning:
    # - election-timeout=1000      # Election timeout in milliseconds
    # - heartbeat-interval=100     # Heartbeat interval in milliseconds
  
  # -- Kubernetes control plane components configuration
  kubeComponents:
    # -- Controller Manager handles cluster-level functions like replication
    kubeControllerManager:
      # -- Additional arguments for controller manager (security, cloud provider, etc.)
      extraArgs: []
      # Common extraArgs examples:
      # - cloud-provider=external            # Use external cloud provider
      # - terminated-pod-gc-threshold=10     # Garbage collect terminated pods
    
    # -- API Server provides the Kubernetes API and validates objects
    kubeApiServer:
      # -- Additional arguments for API server (authentication, authorization, etc.)
      extraArgs: []
      # Common extraArgs examples:
      # - audit-log-path=/var/log/audit.log  # Enable audit logging
      # - enable-admission-plugins=PodSecurity # Enable pod security standards
    
    # -- Scheduler assigns pods to nodes based on resource requirements
    kubeShceduler:
      # -- Additional arguments for scheduler (policies, profiles, etc.)
      extraArgs: []
      # Common extraArgs examples:
      # - v=2                                # Increase verbosity level
      # - kube-api-qps=50                    # API server QPS limit
    
    # -- Proxy handles network rules and load balancing on each node
    kubeProxy:
      # -- Additional arguments for kube-proxy (networking mode, IP tables, etc.)
      extraArgs: []
      # Common extraArgs examples:
      # - proxy-mode=ipvs                    # Use IPVS for better performance
      # - cluster-cidr=10.42.0.0/16         # Pod network CIDR
    
    # -- Kubelet manages pods and containers on each node
    kubelet:
      # -- Additional arguments for kubelet (container runtime, logging, security)
      extraArgs: []
      # Common extraArgs examples:
      # - max-pods=110                       # Maximum pods per node
      # - container-log-max-size=10Mi        # Log rotation settings
  
  # -- Kubernetes labels applied to all cluster nodes for scheduling and selection
  labels: {}
  # -- Kubernetes annotations applied to all cluster nodes for metadata
  annotations: {}

# -- Baremetal infrastructure and node provisioning configuration
infraConfig:
  # -- System users to create on all provisioned nodes (SSH access and administration)
  users:
    - name: whitestack
      password: whitestack
      # -- SSH public keys for passwordless authentication (recommended for automation)
      authorized_keys:
        - "ssh-rsa  hector@hector"
        - "ssh-rsa  luis@tt"
  
  # -- Operating system image configuration for node provisioning
  image:
    # -- HTTP URL where the OS installation image is served (must be accessible by BMC)
    url: http://10.100.100.2/ubuntu-22.iso
    # -- Image identifier used for node provisioning (ubuntu22 supports latest features)
    name: ubuntu22
  
  # -- Linux kernel configuration for provisioned nodes
  kernel:
    # -- Specific kernel version to install (6.5-generic recommended for hardware compatibility)
    version: 6.5-generic

# ===============
# Control Plane Nodes
# ===============
# -- controlPlane nodes configuration
controlPlaneNodes:
  defaults: # configuración por defecto para los nodos control-plane
    taints:
      - key: node-role.kubernetes.io/control-plane
        effect: NoSchedule
    # -- Kubernetes labels
    labels:
      node-role.kubernetes.io/control-plane: ""
    storage:
      - vg_name: vg-root
        disks:
          - sda
          - sdb
        raid_type: 1
        boot: uefi
        lvs:
          - name: lv-root
            # -- Storage size
            size: 80GB
            fs_type: ext4
            mount: /
          - name: lv-logs
            # -- Storage size
            size: 20GB
            fs_type: ext4
            mount: /var/log
          - name: lv-tmp
            # -- Storage size
            size: 2GB
            fs_type: ext4
            mount: /var/tmp
          - name: lv-audit
            # -- Storage size
            size: 5GB
            fs_type: ext4
            mount: /var/log/audit
    bmc:
      provider: ilo
      credentialsSecret:
        # -- Name of the component
        name: "baremetal-cluster"
        # -- Kubernetes namespace
        namespace: "default"
  nodes: # lista de nodos control-plane
    - hostname: node-01
      bmc:
        provider: ilo
        address: 10.40.12.10
        credentialsSecret:
          # -- Name of the component
          name: "baremetal-cluster-1"
          # -- Kubernetes namespace
          namespace: "default"
      network:
        primaryInterface:
          address: 10.100.17.118
        netplan:
          network:
            ethernets:
              eno1:
                addresses:
                  - 10.100.2.150/24
                routes:
                  - to: default
                    via: 10.100.2.1

# ===============
# Worker Nodes
# ===============
# -- worker nodes configuration
workerNodes:
  defaults:
    taints:
      - key: node-role.kubernetes.io/worker
        effect: NoSchedule
    # -- Kubernetes labels
    labels:
      node-role.kubernetes.io/worker: ""
    storage:
      - vg_name: vg-root
        disks:
          - sda
          - sdb
        raid_type: 1
        boot: uefi
        lvs:
          - name: lv-root
            # -- Storage size
            size: 80GB
            fs_type: ext4
            mount: /
          - name: lv-logs
            # -- Storage size
            size: 20GB
            fs_type: ext4
            mount: /var/log
          - name: lv-tmp
            # -- Storage size
            size: 2GB
            fs_type: ext4
            mount: /var/tmp
          - name: lv-audit
            # -- Storage size
            size: 5GB
            fs_type: ext4
            mount: /var/log/audit
    bmc:
      provider: ilo
      credentialsSecret:
        # -- Name of the component
        name: "baremetal-worker-cluster"
        # -- Kubernetes namespace
        namespace: "default"
  nodes:
    - hostname: worker-node-01
      reservedSystemCPU: []
      bmc:
        address: 10.100.19.132
      network:
        primaryInterface:
          address: 10.100.20.198
        netplan:
          network:
            ethernets:
              eno2:
                addresses:
                  - 10.100.2.151/24
                routes:
                  - to: default
                    via: 10.100.2.1

